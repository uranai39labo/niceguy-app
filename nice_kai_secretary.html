  .cal-day-label.sat { color: #2980b9; }

function fmt(d, day) {
  return (d.getMonth()+1) + "/" + d.getDate() + "（" + day + "）";
}
function isFuture(d) { return d >= TODAY; }
function nextDate(key) {
  var future = SCHEDULES[key].dates.filter(function(e){ return isFuture(e.date); });
  return future.length ? future[0] : null;
}

function buildReply(q) {
  var t = q.replace(/\s/g, "");
  var monthMatch = t.match(/(\d+)月/);
  var targetMonth = monthMatch ? parseInt(monthMatch[1]) - 1 : null;

  var is1on1    = /1on1|一対一|ワンオンワン/.test(t);
  var isUranai  = /占い.*枠|受付枠|鑑定.*枠|空き枠|予約枠|占い.*受付/.test(t);
  var isLink    = /リンク|SNS|連絡先|Facebook|インスタ|Instagram|LINE|YouTube|アメブロ|スレッズ|Threads|ショップ|商店|HP|鑑定予約|AI鑑定/.test(t);
  var isAppo    = /予約.*確認|予約.*一覧|入った予約|予約.*入|アポ/.test(t);
  var isTsushin = /通信講座|通信|サポート/.test(t);
  var isMethodo = /メソッド|天地|彌榮|塾/.test(t) && !isTsushin;
  var isNeji    = /ねじ|農法|三浦|ガッテン/.test(t);
  var isTour    = /明治神宮|ツアー/.test(t);
  var isTsuru   = /鶴岡|八幡/.test(t);
  var isTerakotei = /てらこ邸|宅飲み|飲み会.*てらこ|花火/.test(t);
  var isMitake  = /御嶽|撮影/.test(t);
  var isTaue    = /田植え|韮崎/.test(t);
  var isGrazie  = /grazie|グラツィエ/.test(t);
  var isTerako  = /てらこ|寺子/.test(t);
  var isFreeZ   = /無料.*[Zz]oom|無料講座/.test(t);
  var isPaidZ   = /Zoom通信|有料/.test(t) && !isTsushin;
  var isRealW   = /リアル/.test(t) && /平日|木曜/.test(t);
  var isRealS   = /リアル/.test(t) && /日曜/.test(t);
  var isJoint   = /合同|ランチ会/.test(t);
  var isAll     = /全部|全て|すべて|一覧|全日程/.test(t);
  var isMonth   = targetMonth !== null;
  var isNM      = /ニーズ|支部/.test(t);
  var isLecture = /講座|[Zz]oom/.test(t) && !isTsushin && !isMethodo;
  var isToday2  = /今日|本日/.test(t);
  var isThisMonth = /今月/.test(t);
  var isNext    = /次|いつ/.test(t) && !isMonth;

  var isTodo = /やること|タスク|todo|TODO/.test(t);
  if (isTodo) {
    var lines = ["📝 やることリスト（全" + TODO.length + "項目）", ""];
    TODO.forEach(function(item){ lines.push(item); });
    return lines.join("\n");
  }
  if (isAppo) {
    var future = APPOINTMENTS.filter(function(a){ return a.date >= TODAY; });
    if (!future.length) return "現在、入っている予約はありません。";
    var lines = ["📌 入っている予約一覧", ""];
    future.forEach(function(a) {
      var days = ["日","月","火","水","木","金","土"];
      var day = days[a.date.getDay()];
      lines.push((a.date.getMonth()+1) + "/" + a.date.getDate() + "（" + day + "）　" + a.time + "　" + a.label);
    });
    return lines.join("\n");
  }

  if (isLink) {
    return ["✉️ 各種リンク","",
      "HP（リザスト）","　" + LINKS.hp,"",
      "鑑定予約","　" + LINKS.yoyaku,"",
      "Facebook","　" + LINKS.facebook,"",
      "Instagram","　" + LINKS.instagram,"",
      "YouTube","　" + LINKS.youtube,"",
      "LINE公式","　" + LINKS.line,"",
      "スレッズ","　" + LINKS.threads,"",
      "アメブロ","　" + LINKS.ameblo,"",
      "片貝商店","　" + LINKS.shop,"",
      "リンク集","　" + LINKS.linktree,"",
      "🤖 AIナイス貝鑑定",
      "　とってもナイス貝（ChatGPT）",
      "　なかなかナイス貝（Gemini）",
      "　→ " + LINKS.linktree,
    ].join("\n");
  }

  if (is1on1) {
    return ["🤝 1on1 受付枠","",
      "　月曜日　19:00〜20:00",
      "　木曜日　19:00〜20:00",
      "　金曜日　19:00〜20:00","",
      "📩 予約・お問い合わせ",
      "　Facebookメッセンジャー",
      "　" + LINKS.facebook,
    ].join("\n");
  }

  if (isUranai) {
    var lines = ["🔮 占い受付枠（平日夜）",""];
    URANAI_SLOTS.forEach(function(d) {
      lines.push(d.day + "曜日");
      d.slots.forEach(function(s){ lines.push("　" + s); });
    });
    lines.push("","📩 予約・お問い合わせ","　LINE公式：" + LINKS.line);
    return lines.join("\n");
  }

  function single(key) {
    var s = SCHEDULES[key];
    var n = nextDate(key);
    if (!n) return s.emoji + " " + s.label + "の今後の予定はありません。";
    var todayStr = n.date.getTime() === TODAY.getTime() ? "　本日！" : "";
    var noteStr = n.note ? "\n　場所：" + n.note : "";
    var remaining = s.dates.filter(function(e){ return isFuture(e.date); });
    var timeStr = s.time ? "\n　" + s.time : "";
    return s.emoji + " " + s.label + "\n次回：" + n.label + " " + fmt(n.date, n.day) + todayStr + noteStr + timeStr + "\n残り：" + remaining.length + "回";
  }

  if (isTsushin)  return single("tsushin");
  if (isMethodo)  return single("methodo");
  if (isNeji)     return single("neji");
  if (isTerakotei) return single("terakotei");
  if (isTsuru)    return single("tsurugaoka");
  if (isTaue)     return single("taue");
  if (isMitake)   return single("mitake");
  if (isTour)     return single("tour");
  if (isGrazie)   return single("grazie");
  if (isTerako)   return single("terako");
  if (isFreeZ)    return single("zoomFree");
  if (isPaidZ)    return single("zoomPaid");
  if (isRealW)    return single("realWeekday");
  if (isRealS)    return single("realSunday");
  if (isJoint)    return single("joint");
  if (isNM)       return single("grazie") + "\n\n" + single("terako");
  if (isLecture)  return single("zoomFree") + "\n\n" + single("zoomPaid") + "\n\n" + single("realWeekday") + "\n\n" + single("realSunday");

  if (isToday2) {
    var lines = ["本日（" + (TODAY.getMonth()+1) + "/" + TODAY.getDate() + "）の予定",""];
    var found = false;
    Object.values(SCHEDULES).forEach(function(s) {
      var hit = s.dates.find(function(e){ return e.date.getTime() === TODAY.getTime(); });
      if (hit) {
        found = true;
        lines.push(s.emoji + " " + s.label);
        lines.push("　" + hit.label + "：" + fmt(hit.date, hit.day));
        if (s.time) lines.push("　" + s.time);
        lines.push("");
      }
    });
    APPOINTMENTS.forEach(function(a) {
      if (a.date.getTime() === TODAY.getTime()) {
        found = true;
        lines.push("🔮 " + a.label + "　" + a.time);
      }
    });
    if (!found) lines.push("登録されている予定はありません。");
    return lines.join("\n");
  }

  if (isThisMonth) return buildReply((TODAY.getMonth()+1) + "月の予定");

  if (isMonth) {
    var mn = targetMonth + 1;
    var lines = ["📅 " + mn + "月のスケジュール",""];
    var allEvents = [];
    Object.values(SCHEDULES).forEach(function(s) {
      s.dates.filter(function(e){ return e.date.getMonth() === targetMonth; }).forEach(function(e) {
        allEvents.push({ date: e.date, emoji: s.emoji, slabel: s.label, sub: e.label, note: e.note, stime: s.time });
      });
    });
    allEvents.sort(function(a,b){ return a.date - b.date; });
    if (allEvents.length) {
      allEvents.forEach(function(e) {
        var noteStr = e.note ? "（" + e.note + "）" : "";
        lines.push(e.emoji + " " + fmt(e.date, ["日","月","火","水","木","金","土"][e.date.getDay()]) + "　" + e.slabel + " " + e.sub + noteStr);
        if (e.stime) lines.push("　　" + e.stime);
      });
    } else {
      lines.push(mn + "月の予定は登録されていません。");
    }
    return lines.join("\n");
  }

  if (isAll) {
    var lines = ["📅 2026年 全スケジュール一覧",""];
    Object.values(SCHEDULES).forEach(function(s) {
      lines.push(s.emoji + " " + s.label);
      if (s.time) lines.push("　" + s.time);
      s.dates.forEach(function(e) {
        lines.push("　" + e.label + "：" + fmt(e.date, e.day) + (e.note ? "（" + e.note + "）" : ""));
      });
      lines.push("");
    });
    return lines.join("\n");
  }

  if (isNext) {
    var all = [];
    Object.entries(SCHEDULES).forEach(function(entry) {
      var n = nextDate(entry[0]);
      if (n) all.push({ date: n.date, label: n.label, slabel: entry[1].label, emoji: entry[1].emoji });
    });
    all.sort(function(a,b){ return a.date - b.date; });
    var n = all[0];
    return "📅 最も近い次の予定\n\n" + n.emoji + " " + n.slabel + "\n" + n.label + "：" + fmt(n.date, ["日","月","火","水","木","金","土"][n.date.getDay()]);
  }

  return "ボタンを押すか、キーワードでお聞きください。\n\n例：「5月の予定」「次のツアー」「占い受付枠」「全日程」";
}

var calMonth = 4; // 0-indexed (4=May)

function getAllEventsForDate(y, m, d) {
  var result = [];
  Object.values(SCHEDULES).forEach(function(s) {
    s.dates.forEach(function(e) {
      if (e.date.getFullYear()===y && e.date.getMonth()===m && e.date.getDate()===d) {
        result.push({ emoji: s.emoji, label: s.label, sub: e.label, note: e.note, time: s.time });
      }
    });
  });
  APPOINTMENTS.forEach(function(a) {
    if (a.date.getFullYear()===y && a.date.getMonth()===m && a.date.getDate()===d) {
      result.push({ emoji: "🔮", label: a.label, sub: "", note: a.note, time: a.time });
    }
  });
  return result;
}

function renderCalendar() {
  var months = ["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];
  document.getElementById("calTitle").textContent = "2026年 " + months[calMonth];
  var grid = document.getElementById("calGrid");
  grid.innerHTML = "";
  var dayLabels = ["日","月","火","水","木","金","土"];
  dayLabels.forEach(function(d, i) {
    var el = document.createElement("div");
    el.className = "cal-day-label" + (i===0?" sun":i===6?" sat":"");
    el.textContent = d;
    grid.appendChild(el);
  });
  var firstDay = new Date(2026, calMonth, 1).getDay();
  var daysInMonth = new Date(2026, calMonth+1, 0).getDate();
  for (var i=0; i<firstDay; i++) {
    var el = document.createElement("div");
    el.className = "cal-cell empty";
    grid.appendChild(el);
  }
  for (var d=1; d<=daysInMonth; d++) {
    (function(day) {
      var el = document.createElement("div");
      var dow = new Date(2026, calMonth, day).getDay();
      var evts = getAllEventsForDate(2026, calMonth, day);
      var cls = "cal-cell";
      if (evts.length) cls += " has-evt";
      if (calMonth===TODAY.getMonth() && day===TODAY.getDate()) cls += " today";
      el.className = cls;
      var numEl = document.createElement("div");
      numEl.className = "cal-num" + (dow===0?" sun":dow===6?" sat":"");
      numEl.textContent = day;
      el.appendChild(numEl);
      if (evts.length) {
        var dotEl = document.createElement("div");
        dotEl.className = "cal-dot";
        dotEl.textContent = evts.map(function(e){ return e.emoji; }).slice(0,3).join(" ");
        el.appendChild(dotEl);
        el.onclick = function() { showDayDetail(day, evts); };
      }
      grid.appendChild(el);
    })(d);
  }
  document.getElementById("dayDetail").style.display = "none";
}

function showDayDetail(d, evts) {
  var days = ["日","月","火","水","木","金","土"];
  var dow = days[new Date(2026, calMonth, d).getDay()];
  var text = (calMonth+1) + "/" + d + "（" + dow + "）の予定\n\n";
  evts.forEach(function(e) {
    text += e.emoji + " " + e.label;
    if (e.sub) text += " " + e.sub;
    if (e.note) text += "（" + e.note + "）";
    text += "\n";
    if (e.time) text += "　" + e.time + "\n";
  });
  var detail = document.getElementById("dayDetail");
  detail.textContent = text;
  detail.style.display = "block";
}

function changeMonth(dir) {
  calMonth += dir;
  if (calMonth < 0) calMonth = 11;
  if (calMonth > 11) calMonth = 0;
  renderCalendar();
}

  div.appendChild(bubble);
  container.appendChild(div);
  div.scrollIntoView({ behavior: "smooth", block: "end" });
}

<script>
// ── 予定追加機能 ──
var userEvents = [];
try {
  var saved = localStorage.getItem("niceguykatakai_events");
  if (saved) userEvents = JSON.parse(saved);
} catch(e) {}

function saveUserEvents() {
  try { localStorage.setItem("niceguykatakai_events", JSON.stringify(userEvents)); } catch(e) {}
}

function openModal() {
  document.getElementById("eventModal").style.display = "flex";
  document.getElementById("evtName").focus();
}

function closeModal() {
  document.getElementById("eventModal").style.display = "none";
  document.getElementById("evtName").value = "";
  document.getElementById("evtDate").value = "2026-06-01";
  document.getElementById("evtStart").value = "";
  document.getElementById("evtEnd").value = "";
  document.getElementById("evtNote").value = "";
}

function saveEvent() {
  var name = document.getElementById("evtName").value.trim();
  var date = document.getElementById("evtDate").value;
  var start = document.getElementById("evtStart").value;
  var end = document.getElementById("evtEnd").value;
  var note = document.getElementById("evtNote").value.trim();

  if (!name) { alert("イベント名を入力してください"); return; }
  if (!date) { alert("日付を入力してください"); return; }

  var parts = date.split("-");
  var y = parseInt(parts[0]);
  var m = parseInt(parts[1]) - 1;
  var d = parseInt(parts[2]);
  var days = ["日","月","火","水","木","金","土"];
  var dow = days[new Date(y,m,d).getDay()];

  var timeStr = start ? (end ? start + "〜" + end : start + "〜") : "";

  userEvents.push({
    date: date, y: y, m: m, d: d, dow: dow,
    label: name, time: timeStr, note: note, emoji: "📌"
  });
  saveUserEvents();

  // カレンダーに反映
  if (typeof renderCalendar === "function") renderCalendar();

  closeModal();
  alert("「" + name + "」を追加しました！");
}

// ユーザー追加イベントをカレンダーに反映
var origGetEventsForDate = getAllEventsForDate;
getAllEventsForDate = function(y, m, d) {
  var results = origGetEventsForDate(y, m, d);
  userEvents.forEach(function(e) {
    if (e.y === y && e.m === m && e.d === d) {
      results.push({ emoji: e.emoji, label: e.label, sub: "", note: e.note, time: e.time });
    }
  });
  return results;
};

// チャットにも反映
var origBuildReply = buildReply;
buildReply = function(q) {
  var t = q.replace(/\s/g, "");
  var monthMatch = t.match(/(\d+)月/);
  if (monthMatch) {
    var targetMonth = parseInt(monthMatch[1]) - 1;
    var extras = userEvents.filter(function(e){ return e.m === targetMonth; });
    if (extras.length) {
      var base = origBuildReply(q);
      var lines = [base, ""];
      extras.forEach(function(e) {
        lines.push("📌 " + (e.m+1) + "/" + e.d + "（" + e.dow + "）　" + e.label);
        if (e.time) lines.push("　　" + e.time);
        if (e.note) lines.push("　　" + e.note);
      });
      return lines.join("
");
    }
  }
  return origBuildReply(q);
};
</script>
