<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ナイス貝 やることリスト</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: linear-gradient(150deg, #1a1410 0%, #2d2218 100%);
    font-family: 'Hiragino Mincho ProN','游明朝','YuMincho',serif;
    padding: 20px 12px 60px;
    display: flex; flex-direction: column; align-items: center;
    color: #f5f0e8;
  }

  /* ヘッダー */
  .header { text-align: center; margin-bottom: 16px; }
  .brand { font-size: 10px; letter-spacing: 6px; color: #c9a84c; margin-bottom: 4px; }
  .title { font-size: 20px; font-weight: 600; letter-spacing: 2px; color: #f5f0e8; }

  /* レベルバー */
  .level-card {
    width: 100%; max-width: 620px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(201,168,76,0.3);
    border-radius: 14px; padding: 16px 20px;
    margin-bottom: 16px;
  }
  .level-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .level-badge {
    font-size: 28px; font-weight: 700; color: #c9a84c;
    text-shadow: 0 0 20px rgba(201,168,76,0.6);
  }
  .level-title { font-size: 13px; color: #c9a84c; letter-spacing: 1px; }
  .level-xp { font-size: 11px; color: #9a8e82; }
  .xp-bar-bg {
    width: 100%; height: 10px; background: rgba(255,255,255,0.1);
    border-radius: 10px; overflow: hidden;
  }
  .xp-bar {
    height: 100%; background: linear-gradient(90deg, #c9a84c, #f0d080);
    border-radius: 10px; transition: width 0.6s ease;
  }
  .streak { font-size: 11px; color: #f0a040; margin-top: 8px; }

  /* コンテナ */
  .container { width: 100%; max-width: 620px; }

  /* フィルター */
  .filters { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .filter-btn {
    padding: 5px 14px; border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.15);
    background: transparent; color: #9a8e82;
    font-size: 12px; cursor: pointer; font-family: inherit;
  }
  .filter-btn.active { background: #c9a84c; color: #1a1410; border-color: #c9a84c; font-weight: 600; }

  /* タスクカード */
  .priority-label { font-size: 11px; letter-spacing: 2px; color: #7a6e62; margin-bottom: 6px; padding-left: 4px; }
  .priority-section { margin-bottom: 16px; }

  .task-card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px; padding: 12px 14px; margin-bottom: 8px;
    display: flex; align-items: center; gap: 12px;
    transition: all 0.2s;
  }
  .task-card.done { opacity: 0.35; }
  .task-card.priority-high { border-left: 4px solid #e74c3c; }
  .task-card.priority-mid  { border-left: 4px solid #c9a84c; }
  .task-card.priority-low  { border-left: 4px solid #4a9e6e; }

  .check-btn {
    width: 28px; height: 28px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.2);
    background: transparent; cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; transition: all 0.2s; color: #f5f0e8;
  }
  .check-btn:hover { border-color: #c9a84c; }
  .check-btn.checked { background: #c9a84c; border-color: #c9a84c; color: #1a1410; }

  .task-text { flex: 1; font-size: 13px; color: #f5f0e8; line-height: 1.5; }
  .task-text.done { text-decoration: line-through; color: #5a5050; }

  .xp-chip {
    font-size: 10px; padding: 2px 8px; border-radius: 10px;
    flex-shrink: 0; font-weight: 600;
  }
  .xp-high { background: rgba(231,76,60,0.2);  color: #e74c3c; }
  .xp-mid  { background: rgba(201,168,76,0.2); color: #c9a84c; }
  .xp-low  { background: rgba(74,158,110,0.2); color: #4a9e6e; }

  .del-btn {
    background: transparent; border: none; cursor: pointer;
    color: #3a3030; font-size: 16px; flex-shrink: 0; padding: 0 4px;
    transition: color 0.15s;
  }
  .del-btn:hover { color: #e74c3c; }

  /* 追加フォーム */
  .add-area {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px; padding: 12px; margin-top: 8px;
  }
  .add-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .add-input {
    flex: 1; border: 1px solid rgba(255,255,255,0.15); border-radius: 8px;
    padding: 8px 12px; font-family: inherit; font-size: 13px;
    color: #f5f0e8; outline: none; background: rgba(255,255,255,0.07);
  }
  .add-input::placeholder { color: #5a5050; }
  .priority-select {
    border: 1px solid rgba(255,255,255,0.15); border-radius: 8px;
    padding: 8px 10px; font-family: inherit; font-size: 12px;
    color: #f5f0e8; outline: none; background: rgba(255,255,255,0.07); cursor: pointer;
  }
  .add-btn {
    background: #c9a84c; color: #1a1410; border: none;
    padding: 8px 0; border-radius: 8px; cursor: pointer;
    font-family: inherit; font-size: 13px; font-weight: 600; width: 100%;
  }

  .stats { font-size: 11px; color: #5a5050; text-align: center; margin-top: 12px; letter-spacing: 1px; }

  /* レベルアップ演出 */
  .levelup-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.85);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 999; animation: fadeIn 0.3s ease;
  }
  .levelup-box { text-align: center; }
  .levelup-emoji { font-size: 60px; margin-bottom: 10px; animation: bounce 0.6s ease infinite alternate; }
  .levelup-text { font-size: 28px; font-weight: 700; color: #c9a84c; letter-spacing: 4px; margin-bottom: 8px; }
  .levelup-sub { font-size: 16px; color: #f5f0e8; margin-bottom: 6px; }
  .levelup-title { font-size: 20px; color: #c9a84c; font-weight: 600; margin-bottom: 24px; }
  .levelup-close {
    background: #c9a84c; color: #1a1410; border: none;
    padding: 12px 40px; border-radius: 30px; font-size: 15px;
    cursor: pointer; font-family: inherit; font-weight: 600;
  }
  /* タスク完了演出 */
  .done-popup {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: linear-gradient(135deg, #1a1410, #2d2218);
    border: 2px solid #c9a84c; border-radius: 20px;
    padding: 20px 28px; z-index: 998; pointer-events: none;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    box-shadow: 0 0 40px rgba(201,168,76,0.4);
    animation: popFade 2s ease forwards;
  }
  .popup-chara {
    width: 80px; height: 80px; image-rendering: pixelated;
  }
  .popup-text {
    color: #c9a84c; font-size: 16px; font-weight: 700;
    letter-spacing: 2px; white-space: nowrap;
  }
  .levelup-chara {
    width: 100px; height: 100px; image-rendering: pixelated;
    animation: jump 0.4s ease infinite;
    margin-bottom: 4px;
  }
  .levelup-xp-info {
    font-size: 13px; color: #9a8e82; margin-bottom: 8px;
  }

  @keyframes fadeIn { from{opacity:0} to{opacity:1} }
  @keyframes bounce { from{transform:translateY(0)} to{transform:translateY(-12px)} }
  @keyframes popFade {
    0%   { opacity:0; transform:translate(-50%,-60%); }
    20%  { opacity:1; transform:translate(-50%,-50%); }
    70%  { opacity:1; }
    100% { opacity:0; transform:translate(-50%,-40%); }
  }
  /* キャラクター */
  @keyframes float {
    0%   { transform: translateY(0px); }
    50%  { transform: translateY(-8px); }
    100% { transform: translateY(0px); }
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20%     { transform: translateX(-6px); }
    40%     { transform: translateX(6px); }
    60%     { transform: translateX(-4px); }
    80%     { transform: translateX(4px); }
  }
  @keyframes jump {
    0%,100% { transform: translateY(0); }
    40%     { transform: translateY(-18px); }
    60%     { transform: translateY(-14px); }
  }
  .chara-area {
    position: relative; text-align: center; margin-bottom: 4px;
  }
  .speech-bubble {
    position: absolute; top: -10px; left: 50%; transform: translateX(-10%);
    background: #fff; color: #1a1410; border-radius: 12px;
    padding: 6px 12px; font-size: 12px; font-weight: 600;
    white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    animation: popIn 0.3s ease;
  }
  .speech-bubble::after {
    content: ''; position: absolute; bottom: -8px; left: 20px;
    border: 8px solid transparent; border-top-color: #fff; border-bottom: none;
  }
  @keyframes popIn {
    from { opacity:0; transform: translateX(-10%) scale(0.7); }
    to   { opacity:1; transform: translateX(-10%) scale(1); }
  }
  /* 音声入力 */
  .voice-area {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(201,168,76,0.3);
    border-radius: 12px; padding: 14px;
    margin-bottom: 12px;
  }
  .voice-title {
    font-size: 11px; letter-spacing: 3px; color: #c9a84c;
    margin-bottom: 10px;
  }
  .voice-btn {
    width: 60px; height: 60px; border-radius: 50%;
    background: #c9a84c; border: none; cursor: pointer;
    font-size: 24px; display: flex; align-items: center;
    justify-content: center; margin: 0 auto 10px;
    transition: all 0.2s; box-shadow: 0 0 0 0 rgba(201,168,76,0.4);
  }
  .voice-btn.recording {
    background: #e74c3c;
    animation: pulse 1s infinite;
  }
  .voice-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(231,76,60,0.5); }
    70%  { box-shadow: 0 0 0 14px rgba(231,76,60,0); }
    100% { box-shadow: 0 0 0 0 rgba(231,76,60,0); }
  }
  .voice-transcript {
    background: rgba(255,255,255,0.07); border-radius: 8px;
    padding: 10px 12px; font-size: 12px; color: #9a8e82;
    min-height: 48px; line-height: 1.7; margin-bottom: 8px;
    display: none;
  }
  .voice-result {
    display: none; margin-top: 8px;
  }
  .voice-task-preview {
    background: rgba(201,168,76,0.1); border: 1px solid rgba(201,168,76,0.3);
    border-radius: 8px; padding: 10px 12px; margin-bottom: 8px;
  }
  .voice-task-item {
    font-size: 13px; color: #f5f0e8; padding: 4px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    display: flex; align-items: center; gap: 8px;
  }
  .voice-task-item:last-child { border-bottom: none; }
  .voice-add-btn {
    background: #c9a84c; color: #1a1410; border: none;
    padding: 10px; border-radius: 8px; cursor: pointer;
    font-family: inherit; font-size: 13px; font-weight: 600;
    width: 100%; margin-top: 4px;
  }
  .voice-status {
    text-align: center; font-size: 11px; color: #9a8e82;
    margin-bottom: 4px;
  }
  .ai-thinking {
    text-align: center; font-size: 12px; color: #c9a84c;
    padding: 10px; display: none;
  }
  .empty { text-align: center; color: #5a5050; font-size: 13px; padding: 30px; }
</style>
</head>

var speechTimer = null;

function setChara(pose, message) {
  var img = document.getElementById("charaImg");
  var bubble = document.getElementById("charaSpeech");
  if (img) {
    img.src = CHAR_IMGS[pose];
    var anims = { normal:"float 2.4s ease-in-out infinite", victory:"jump 0.5s ease 3", banzai:"jump 0.4s ease 4", down:"shake 0.5s ease 2" };
    img.style.animation = anims[pose] || "float 2.4s ease-in-out infinite";
    if (pose === "normal" || pose === "down") {
      setTimeout(function(){ if(img) img.style.animation = pose==="down" ? "shake 3s ease-in-out infinite" : "float 2.4s ease-in-out infinite"; }, 1200);
    }
  }
  if (message && bubble) {
    bubble.textContent = message;
    bubble.style.display = "block";
    if (speechTimer) clearTimeout(speechTimer);
    speechTimer = setTimeout(function() {
      bubble.style.display = "none";
      updateCharaByState();
    }, 2500);
  }
}

function updateCharaByState() {
  var active = state.tasks.filter(function(t){ return !t.done; }).length;
  if (active === 0) {
    setChara("banzai", null);
  } else if (active >= 10) {
    setChara("down", null);
  } else {
    setChara("normal", null);
  }
}

var STORAGE_KEY = "niceguykatakai_todo_v2";
var GAS_URL = "https://script.google.com/macros/s/AKfycbyWy_JhFbYcwHfRXme7ur_8OuiTbMEPiZWIl0SJKv714uzaucSSPRG8RoWWIguXoTCx9A/exec";
var isSyncing = false;

function gasLoad(callback) {
  fetch(GAS_URL + "?action=load")
    .then(function(r){ return r.json(); })
    .then(function(data) {
      if (data.tasks) {
        try {
          state.tasks = JSON.parse(data.tasks);
          state.xp = parseInt(data.xp) || 0;
          state.totalDone = parseInt(data.totalDone) || 0;
          state.nextId = parseInt(data.nextId) || 100;
        } catch(e) {}
      }
      callback();
    })
    .catch(function(){ callback(); });
}

function gasSave() {
  if (isSyncing) return;
  isSyncing = true;
  var payload = {
    tasks: JSON.stringify(state.tasks),
    xp: String(state.xp),
    totalDone: String(state.totalDone),
    nextId: String(state.nextId),
  };
  fetch(GAS_URL + "?action=save", {
    method: "POST",
    body: JSON.stringify(payload),
  })
  .catch(function(){})
  .finally(function(){ isSyncing = false; });
}

function load(callback) {
  // まずlocalStorageから読み込む
  try {
    var s = localStorage.getItem(STORAGE_KEY);
    if (s) { state = JSON.parse(s); }
    else { state.tasks = DEFAULT_TASKS.slice(); }
  } catch(e) { state.tasks = DEFAULT_TASKS.slice(); }
  // GASからも読み込んで上書き
  gasLoad(function() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    if (callback) callback();
  });
}

function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
  gasSave();
}

function getLevelInfo(xp) {
  var info = LEVEL_TABLE[0];
  for (var i=0; i<LEVEL_TABLE.length; i++) {
    if (xp >= LEVEL_TABLE[i].need) info = LEVEL_TABLE[i];
  }
  var next = LEVEL_TABLE[Math.min(info.lv, LEVEL_TABLE.length-1)];
  var prevNeed = info.need;
  var nextNeed = next ? next.need : info.need + 500;
  var pct = next && next.need > prevNeed ? Math.round((xp - prevNeed) / (nextNeed - prevNeed) * 100) : 100;
  return { lv: info.lv, title: info.title, pct: Math.min(pct,100), cur: xp - prevNeed, max: nextNeed - prevNeed, isMax: info.lv >= 10 };
}

function updateLevelUI() {
  var info = getLevelInfo(state.xp);

  document.getElementById("lvlTitle").textContent = info.title;

  document.getElementById("xpBar").style.width = info.pct + "%";

}

  if (!task) return;

  if (!task.done) {
    task.done = true;
    var xpGain = XP_MAP[task.priority] || 5;
    state.xp += xpGain;
    state.totalDone++;
    var newLv = getLevelInfo(state.xp).lv;
    save();
    updateLevelUI();
    var poses = { high:"banzai", mid:"victory", low:"victory" };
    var msgs  = { high:"最高！やったぞ！", mid:"よし！いい感じ！", low:"一歩一歩！" };
    var donepose = poses[task.priority]||"victory";
    setChara(donepose, msgs[task.priority]||"やった！");
    showDoneFlash("+" + xpGain + " XP ✨ " + task.text.slice(0,12) + "…", donepose);
    if (newLv > prevLv) {
      var info = getLevelInfo(state.xp);
      setTimeout(function(){
        setChara("banzai", "レベルアップ！！");
        showLevelUp(info.lv, info.title);
      }, 400);
    }
  } else {
    var xpLoss = XP_MAP[task.priority] || 5;
    task.done = false;
    state.xp = Math.max(0, state.xp - xpLoss);
    state.totalDone = Math.max(0, state.totalDone - 1);
    save();
    updateLevelUI();
  }
  render();
}

function deleteTask(id) {
  if (!confirm("削除しますか？")) return;
  state.tasks = state.tasks.filter(function(t){ return t.id!==id; });
  save(); render();
  setChara("normal", "よし、やってみよう！");
}

function addTask() {
  var input = document.getElementById("newTask");
  var text = input.value.trim();
  if (!text) return;
  var priority = document.getElementById("newPriority").value;
  state.tasks.push({ id: state.nextId++, text: text, priority: priority, done: false });
  input.value = "";
  save(); render();
}

function setFilter(f) {
  currentFilter = f;
  ["all","active","done"].forEach(function(x){
    document.getElementById("f-"+x).className = "filter-btn" + (x===f?" active":"");
  });
  render();
}

function render() {
  var list = document.getElementById("taskList");
  list.innerHTML = "";

  var filtered = state.tasks.filter(function(t) {
    if (currentFilter==="active") return !t.done;
    if (currentFilter==="done")   return t.done;
    return true;
  });

  var sections = [
    { key:"high", label:"🔴 優先度：高（+15XP）", cls:"priority-high", chipCls:"xp-high", chip:"+15" },
    { key:"mid",  label:"🟡 優先度：中（+8XP）",  cls:"priority-mid",  chipCls:"xp-mid",  chip:"+8"  },
    { key:"low",  label:"🟢 優先度：低（+3XP）",  cls:"priority-low",  chipCls:"xp-low",  chip:"+3"  },
  ];

  var hasAny = false;
  sections.forEach(function(sec) {
    var items = filtered.filter(function(t){ return t.priority===sec.key; });
    if (!items.length) return;
    hasAny = true;

    var section = document.createElement("div");
    section.className = "priority-section";
    var lbl = document.createElement("div");
    lbl.className = "priority-label";
    lbl.textContent = sec.label;
    section.appendChild(lbl);

    items.forEach(function(t) {
      var card = document.createElement("div");
      card.className = "task-card " + sec.cls + (t.done?" done":"");

      var cb = document.createElement("button");
      cb.className = "check-btn" + (t.done?" checked":"");
      cb.textContent = t.done ? "✓" : "";
      cb.onclick = (function(id){ return function(){ toggleDone(id); }; })(t.id);
      card.appendChild(cb);

      var tx = document.createElement("div");
      tx.className = "task-text" + (t.done?" done":"");
      tx.textContent = t.text;
      card.appendChild(tx);

      var chip = document.createElement("span");
      chip.className = "xp-chip " + sec.chipCls;
      chip.textContent = t.done ? "済" : sec.chip;
      if (!t.done) {
        chip.style.cursor = "pointer";
        chip.title = "タップで優先度変更";
        chip.onclick = (function(id) { return function(e) {
          e.stopPropagation();
          changePriority(id);
        }; })(t.id);
      }
      card.appendChild(chip);

      var del = document.createElement("button");
      del.className = "del-btn";
      del.textContent = "×";
      del.onclick = (function(id){ return function(){ deleteTask(id); }; })(t.id);
      card.appendChild(del);

      section.appendChild(card);
    });
    list.appendChild(section);
  });

  if (!hasAny) {
    var empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = currentFilter==="done" ? "完了済みなし" : "全タスク完了！🎊";
    list.appendChild(empty);
  }

  var total = state.tasks.length;
  var done = state.tasks.filter(function(t){ return t.done; }).length;
  document.getElementById("stats").textContent = "完了 " + done + " / 全 " + total + " 件";
  updateLevelUI();
  updateCharaByState();
}

// ── 日記からタスク抽出 ──
var voiceTasks = [];

function analyzeText() {
  var text = document.getElementById("pasteArea").value.trim();
  if (!text) { alert("テキストを貼り付けてください"); return; }

  // 1行ずつに分割
  var lines = text.split(/\n/);
  voiceTasks = [];

  lines.forEach(function(line) {
    // 行頭の記号・空白を取り除く
    var cleaned = line
      .replace(/^[\s　]*[□■●○◯・\.\-\*#\[\]✓✔︎]+[\s　]*/u, "")
      .replace(/^[\s　]+/, "")
      .trim();

    // 空行・短すぎる行はスキップ
    if (cleaned.length < 2) return;

    // 優先度を自動判定
    var priority = "mid";
    if (/連絡|電話|メール|返信|確認|締め切り|急|至急/.test(cleaned)) priority = "high";
    if (/構築|設定|作成|制作|まとめ|整理|研究|調査/.test(cleaned)) priority = "low";

    voiceTasks.push({ text: cleaned, priority: priority });
  });

  if (voiceTasks.length === 0) {
    alert("タスクが見つかりませんでした。箇条書きで貼り付けてください。");
    return;
  }
  showVoicePreview(voiceTasks);
}

function changePriority(id) {
  var priorities = ["high", "mid", "low"];
  var labels = { high:"🔴 高", mid:"🟡 中", low:"🟢 低" };
  state.tasks.forEach(function(t) {
    if (t.id === id) {
      var idx = priorities.indexOf(t.priority);
      t.priority = priorities[(idx + 1) % 3];
      showDoneFlash("優先度を " + labels[t.priority] + " に変更", "normal");
    }
  });
  save();
  render();
}

function showVoicePreview(tasks) {
  var preview = document.getElementById("voiceTaskPreview");
  var priorityLabel = { high: "🔴", mid: "🟡", low: "🟢" };
  preview.innerHTML = "";
  tasks.forEach(function(t) {
    var div = document.createElement("div");
    div.className = "voice-task-item";
    div.textContent = (priorityLabel[t.priority] || "🟡") + " " + t.text;
    preview.appendChild(div);
  });
  document.getElementById("voiceResult").style.display = "block";
}

function addVoiceTasks() {
  var count = voiceTasks.length;
  voiceTasks.forEach(function(t) {
    state.tasks.push({
      id: state.nextId++,
      text: t.text,
      priority: t.priority || "mid",
      done: false
    });
  });
  save();
  render();
  document.getElementById("voiceResult").style.display = "none";
  document.getElementById("pasteArea").value = "";
  voiceTasks = [];
  showDoneFlash(count + "件のタスクを追加しました！", "normal");
}

// 読み込み中表示
document.getElementById("taskList").innerHTML = '<div class="empty">データを読み込み中…</div>';
load(function() {
  render();
});
</script>
