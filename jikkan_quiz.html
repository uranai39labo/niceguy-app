<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>逆引き十干鑑定｜黄金の羅針盤</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap');

:root {
  --gold: #C9A84C;
  --gold-light: #E8CB7A;
  --gold-pale: #F5EDD0;
  --ink: #1A1208;
  --white: #FAFAF7;
  --muted: #6A5A3A;
  --border: rgba(201,168,76,0.25);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: var(--white);
  color: var(--ink);
  font-family: 'Noto Sans JP', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ── HEADER ── */
.header {
  background: var(--ink);
  padding: 20px 24px 18px;
  text-align: center;
  position: relative;
  overflow: hidden;
  flex-shrink: 0;
}
.header::before {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at 50% 0%, rgba(201,168,76,0.15) 0%, transparent 60%);
}
.header-eyebrow {
  font-size: 9px; letter-spacing: 3px; color: var(--gold);
  opacity: .8; margin-bottom: 8px; position: relative;
}
.header-title {
  font-family: 'Shippori Mincho', serif;
  font-size: clamp(18px, 4.5vw, 26px);
  font-weight: 800; color: var(--gold-light);
  line-height: 1.4; position: relative;
}

/* ── MAIN ── */
.main {
  max-width: 480px;
  width: 100%;
  margin: 0 auto;
  padding: 20px 24px 24px;
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
@media (min-width: 768px) {
  .main { max-width: 560px; padding: 32px 40px; }
  .header { padding: 28px 24px 24px; }
}

/* ── INTRO ── */
#screenIntro { text-align: center; }
.intro-text {
  font-size: 14px; color: #3A2A1A; line-height: 2.1;
  margin-bottom: 32px;
}
.intro-text strong { color: var(--ink); font-weight: 700; }
.btn-start {
  width: 100%; padding: 18px;
  background: var(--ink); border: none; color: var(--white);
  font-family: 'Shippori Mincho', serif;
  font-size: 16px; font-weight: 700; letter-spacing: 3px;
  cursor: pointer; border-radius: 4px; transition: background .2s;
}
.btn-start:hover { background: #333; }

/* ── PROGRESS ── */
.progress-wrap { margin-bottom: 18px; }
.progress-label {
  display: flex; justify-content: space-between;
  font-size: 11px; color: var(--muted); margin-bottom: 8px; letter-spacing: 1px;
}
.progress-bar {
  height: 6px; background: #EEE8D8; border-radius: 3px; overflow: hidden;
}
.progress-fill {
  height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold-light));
  border-radius: 3px; transition: width .4s ease;
}

/* ── QUIZ ── */
#screenQuiz { display: none; }
.q-number {
  font-family: 'Shippori Mincho', serif;
  font-size: 12px; color: var(--gold); letter-spacing: 2px;
  margin-bottom: 8px; font-weight: 700;
}
.q-text {
  font-family: 'Shippori Mincho', serif;
  font-size: clamp(16px, 4vw, 20px);
  font-weight: 700; line-height: 1.6; color: var(--ink);
  margin-bottom: 18px;
}
@media (min-width: 768px) {
  .q-text { font-size: 22px; margin-bottom: 24px; }
}
.options { display: flex; flex-direction: column; gap: 8px; }
.option {
  background: #F0EDE4;
  border: 1px solid #E0D8C0;
  border-radius: 6px;
  padding: 13px 16px;
  font-size: 13px;
  line-height: 1.6;
  cursor: pointer;
  transition: all .15s;
  text-align: left;
}
@media (min-width: 768px) {
  .option { padding: 16px 20px; font-size: 15px; line-height: 1.7; }
}
.option:hover { background: var(--gold-pale); border-color: var(--gold); }
.option:active { transform: scale(0.98); }
.option-label {
  display: inline-block;
  width: 22px; height: 22px;
  background: var(--ink);
  color: var(--white);
  border-radius: 50%;
  font-size: 11px;
  font-weight: 700;
  text-align: center;
  line-height: 22px;
  margin-right: 10px;
  flex-shrink: 0;
}

/* ── RESULT (十干結果) ── */
#screenResult { display: none; }
.result-divider { border: none; border-top: 1px solid var(--border); margin: 0 0 28px; }

.type-card { text-align: center; margin-bottom: 24px; }
.type-badge {
  display: inline-block; font-size: 12px; letter-spacing: 2px;
  color: var(--white); background: var(--ink);
  padding: 5px 18px; border-radius: 20px; margin-bottom: 14px; font-weight: 700;
}
.type-icon { font-size: 64px; line-height: 1; margin-bottom: 10px; }
.type-kanji {
  font-family: 'Shippori Mincho', serif;
  font-size: clamp(28px, 7vw, 38px);
  font-weight: 800; line-height: 1; margin-bottom: 6px;
}
.type-yomi-row {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 13px; color: var(--muted); letter-spacing: 1px; margin-bottom: 14px;
}
.color-dot {
  width: 13px; height: 13px; border-radius: 50%; display: inline-block;
  border: 1px solid rgba(0,0,0,0.1); flex-shrink: 0;
}
.type-main {
  font-family: 'Shippori Mincho', serif;
  font-size: clamp(30px, 8vw, 44px);
  font-weight: 800; color: var(--ink); margin-bottom: 6px;
}
.type-sub { font-size: 15px; color: var(--muted); line-height: 1.7; }

.copy-box {
  background: var(--gold-pale); border-radius: 6px; padding: 14px 18px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  margin-bottom: 20px;
}
.copy-text { font-family: 'Shippori Mincho', serif; font-size: 15px; font-weight: 700; color: var(--ink); }
.btn-copy {
  flex-shrink: 0; padding: 7px 14px; background: var(--ink); border: none;
  color: var(--white); font-size: 11px; font-weight: 700; letter-spacing: 1px;
  cursor: pointer; border-radius: 4px; transition: background .2s; white-space: nowrap;
  font-family: 'Noto Sans JP', sans-serif;
}
.btn-copy:hover { background: #333; }
.btn-copy.copied { background: #4A7A50; }

.light-box {
  background: var(--gold-pale); border-left: 3px solid var(--gold);
  border-radius: 0 4px 4px 0; padding: 18px 20px; margin-bottom: 14px;
}
.light-label { font-size: 10px; letter-spacing: 3px; color: var(--gold); font-weight: 700; margin-bottom: 8px; }
.light-text { font-size: 14px; font-weight: 500; line-height: 1.9; color: #3A2A1A; }

.shadow-box {
  background: #F0EDE4; border-left: 3px solid #8A7A5A;
  border-radius: 0 4px 4px 0; padding: 18px 20px; margin-bottom: 20px;
}
.shadow-label { font-size: 10px; letter-spacing: 3px; color: #8A7A5A; font-weight: 700; margin-bottom: 8px; }
.shadow-text { font-size: 14px; font-weight: 500; line-height: 1.9; color: var(--ink); }

.bridge { text-align: center; font-size: 15px; color: var(--muted); line-height: 2; margin-bottom: 24px; }
.bridge strong { color: var(--ink); font-weight: 700; }

.btn-cta {
  display: block; width: 100%; padding: 18px;
  background: var(--ink); color: var(--white);
  font-family: 'Shippori Mincho', serif; font-size: 16px; font-weight: 700;
  letter-spacing: 3px; text-decoration: none; text-align: center;
  border-radius: 4px; transition: background .2s; margin-bottom: 12px;
}
.btn-cta:hover { background: #333; }
.btn-reset {
  display: block; background: none; border: none; color: #AAA;
  font-size: 12px; cursor: pointer; letter-spacing: 1px;
  text-decoration: underline; margin: 0 auto; font-family: 'Noto Sans JP', sans-serif;
}
</style>
</head>
<body>

<div class="header">
  <div class="header-eyebrow">黄金の羅針盤 · 干支学</div>
  <div class="header-title">逆引き十干鑑定</div>

<div class="main">

  <div id="screenQuiz">

    <div class="light-box">

    </div>

    <div class="shadow-box">
      <div class="shadow-label">あなたの伸び方のクセ</div>
      <div class="shadow-text" id="rShadow"></div>
    </div>

    <div class="bridge">

      黄金の羅針盤にある。

    <a class="btn-cta" href="https://note.com/nicekai/n/n265857ef361e" target="_blank">

</div>

// 五行(0-4) × 陰陽(true=陽,false=陰) → JIKKANインデックス
// 木:0,1 火:2,3 土:4,5 金:6,7 水:8,9  (陽が偶数,陰が奇数)
function getJikkanFromAnswers(elementIdx, isYang) {
  const base = elementIdx * 2;
  return isYang ? base : base + 1;
}

// ══════════════════════════
// クイズ制御
// ══════════════════════════
let currentQ = 0;
let elementCount = [0,0,0,0,0]; // A,B,C,D,E
let yangCount = 0;
let yinCount = 0;

function startQuiz() {
  document.getElementById('screenIntro').style.display = 'none';
  document.getElementById('screenQuiz').style.display = 'block';
  currentQ = 0;
  elementCount = [0,0,0,0,0];
  yangCount = 0;
  yinCount = 0;
  renderQuestion();
}

function renderQuestion() {
  const q = QUESTIONS[currentQ];
  const total = QUESTIONS.length;

  document.getElementById('progressText').textContent = `Q${currentQ+1} / ${total}`;
  document.getElementById('progressPercent').textContent = Math.round(((currentQ)/total)*100) + '%';
  document.getElementById('progressFill').style.width = ((currentQ)/total*100) + '%';
  document.getElementById('qNumber').textContent = `QUESTION ${String(currentQ+1).padStart(2,'0')}`;
  document.getElementById('qText').textContent = q.q;

  const optsEl = document.getElementById('qOptions');
  optsEl.innerHTML = q.opts.map((opt, i) => `
    <div class="option" onclick="selectOption(${i})">
      <span class="option-label">${String.fromCharCode(65+i)}</span>${opt}
    </div>
  `).join('');

  window.scrollTo({top:0, behavior:'smooth'});
}

function selectOption(idx) {
  const q = QUESTIONS[currentQ];
  if (q.yy) {
    // 陰陽質問：0=陽, 1=陰
    if (idx === 0) yangCount++; else yinCount++;
  } else {
    // 五行質問：0=A(木) 1=B(火) 2=C(土) 3=D(金) 4=E(水)
    elementCount[idx]++;
  }

  currentQ++;
  if (currentQ < QUESTIONS.length) {
    renderQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  document.getElementById('screenQuiz').style.display = 'none';

  // 五行判定：最多のインデックス
  let maxCount = -1, elementIdx = 0;
  elementCount.forEach((c, i) => {
    if (c > maxCount) { maxCount = c; elementIdx = i; }
  });

  // 陰陽判定
  const isYang = yangCount >= yinCount;

  const jikkanIdx = getJikkanFromAnswers(elementIdx, isYang);
  const k = JIKKAN[jikkanIdx];

  document.getElementById('rBadge').textContent      = k.badge;
  document.getElementById('rKanji').textContent       = k.kanji;
  document.getElementById('rKanji').style.color       = k.color;
  document.getElementById('rYomi').textContent        = k.kanji + '（' + k.yomi + '）';
  document.getElementById('rColorDot').style.background = k.color;
  document.getElementById('rColorName').textContent   = k.colorName;
  document.getElementById('rIcon').textContent        = k.icon;
  document.getElementById('rMain').textContent        = k.main;
  document.getElementById('rSub').textContent         = k.sub;
  document.getElementById('rLight').textContent       = k.light;
  document.getElementById('rShadow').textContent      = k.shadow;
  document.getElementById('rCopyText').textContent    = k.main + ' | ' + k.badge.split(' ')[0];

  document.getElementById('screenResult').style.display = 'block';
  window.scrollTo({top:0, behavior:'smooth'});
}

function copyResult() {
  const text = document.getElementById('rCopyText').textContent + '\n#黄金の羅針盤 #干支学 #逆引き十干鑑定';
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.textContent = 'コピー済み';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = 'コピー';
      btn.classList.remove('copied');
    }, 2000);
  });
}

function resetQuiz() {
  document.getElementById('screenResult').style.display = 'none';
  document.getElementById('screenIntro').style.display = 'block';
  window.scrollTo({top:0, behavior:'smooth'});
}
</script>
