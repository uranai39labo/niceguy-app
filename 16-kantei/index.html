<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>16鑑定アプリ</title>
    <style>
:root {
  --bg: #f4f0e8;
  --panel: #fffdf8;
  --muted-panel: #f1eadf;
  --text: #292521;
  --muted: #74695d;
  --line: #ded4c5;
  --energy: #2f7f8d;
  --mind: #b9822b;
  --nature: #4f8f68;
  --tactics: #7c638d;
  --identity: #b95c58;
  --focus: #2f2a25;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background:
    radial-gradient(circle at 12% 8%, rgba(185, 92, 88, 0.08), transparent 28%),
    radial-gradient(circle at 84% 12%, rgba(47, 127, 141, 0.1), transparent 26%),
    linear-gradient(135deg, #f7f2e9 0%, #eee7dc 100%);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

button,
input {
  font: inherit;
}

.app-shell {
  width: min(900px, calc(100% - 32px));
  margin: 30px auto;
}

.result-panel,
.question-panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 18px;
  box-shadow: 0 18px 44px rgba(74, 58, 38, 0.12);
}

.result-panel {
  padding: 22px;
}

.question-panel {
  min-width: 0;
  overflow: hidden;
}

.result-topline,
.question-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.question-header {
  padding: 24px 28px 22px;
  border-bottom: 1px solid var(--line);
  background: #fbf7ef;
}

.is-hidden {
  display: none;
}

.progress-track {
  height: 6px;
  background: #e6dccf;
}

.progress-fill {
  width: 0%;
  height: 100%;
  background: linear-gradient(90deg, #b9822b, #2f7f8d);
  transition: width 180ms ease;
}

.eyebrow {
  margin: 0 0 3px;
  color: var(--muted);
  font-size: 13px;
  font-weight: 700;
}

h1,
h2 {
  margin: 0;
  letter-spacing: 0;
}

h1 {
  font-size: 34px;
}

h2 {
  font-size: 30px;
}

.ghost-button {
  min-height: 36px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: #fffdf8;
  color: var(--text);
  padding: 0 12px;
  cursor: pointer;
}

.primary-button {
  min-height: 40px;
  border: 0;
  border-radius: 999px;
  background: #2f2a25;
  color: #fff;
  padding: 0 14px;
  font-weight: 800;
  cursor: pointer;
}

.ghost-button:hover,
.primary-button:hover,
.answer-option:hover {
  border-color: #9aa4b2;
}

.type-summary {
  display: grid;
  grid-template-columns: 76px 1fr 140px;
  gap: 16px;
  align-items: center;
  margin: 24px 0 22px;
  padding: 18px;
  background: #f4ede3;
  border-radius: 16px;
}

.type-mark {
  display: grid;
  place-items: center;
  min-height: 64px;
  border-radius: 14px;
  background: #2f2a25;
  color: #fff;
  font-size: 18px;
  font-weight: 800;
}

.type-label {
  color: var(--muted);
  font-size: 13px;
  font-weight: 700;
}

.type-name {
  margin-top: 2px;
  font-size: 32px;
  line-height: 1.1;
  font-weight: 850;
}

.type-japanese {
  margin-top: 6px;
  font-size: 22px;
  line-height: 1.2;
  font-weight: 850;
}

.type-group {
  display: inline-flex;
  width: fit-content;
  margin-top: 8px;
  border-radius: 999px;
  background: #fffdf8;
  color: var(--muted);
  padding: 5px 10px;
  font-size: 13px;
  font-weight: 800;
}

.type-copy {
  margin-top: 6px;
  color: var(--muted);
  font-size: 14px;
  line-height: 1.5;
}

.type-illustration {
  display: grid;
  place-items: center;
  min-height: 132px;
}

.type-illustration svg {
  width: 150px;
  height: 125px;
  display: block;
}

.type-description {
  margin: -4px 0 18px;
  padding: 16px 18px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: #fffdf8;
  color: var(--text);
  font-size: 15px;
  font-weight: 650;
  line-height: 1.7;
}

.result-actions {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
}

.copy-status {
  min-height: 20px;
  color: var(--muted);
  font-size: 13px;
  font-weight: 700;
}

.share-preview {
  display: grid;
  gap: 10px;
  margin: 0 0 20px;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: #fffdf8;
}

.share-preview.is-hidden {
  display: none;
}

.share-preview p {
  margin: 0;
  color: var(--muted);
  font-size: 13px;
  font-weight: 800;
}

.share-preview img {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 6px;
  border: 1px solid var(--line);
  -webkit-touch-callout: default;
  user-select: auto;
}

.trait-list {
  display: grid;
  gap: 22px;
}

.trait-row {
  --trait-color: var(--energy);
  --trait-soft-color: #d9edf3;
  display: grid;
  gap: 10px;
  padding: 14px 16px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: #fffaf2;
}

.trait-title {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
}

.trait-title strong {
  font-size: 18px;
}

.trait-score {
  display: inline-flex;
  align-items: center;
  min-height: 34px;
  border-radius: 999px;
  background: var(--trait-soft-color);
  color: var(--trait-color);
  padding: 4px 12px;
  font-size: 18px;
  font-weight: 850;
}

.trait-bar {
  position: relative;
  height: 22px;
  border-radius: 999px;
  background: var(--trait-soft-color);
  overflow: visible;
}

.trait-fill {
  position: absolute;
  top: 0;
  width: var(--strong-score);
  height: 100%;
  border-radius: inherit;
  background: var(--trait-color);
}

.trait-bar.is-left-strong .trait-fill {
  left: 0;
}

.trait-bar.is-right-strong .trait-fill {
  right: 0;
}

.trait-center {
  position: absolute;
  z-index: 2;
  top: -7px;
  left: 50%;
  width: 3px;
  height: 36px;
  border-radius: 999px;
  background: rgba(41, 37, 33, 0.32);
  transform: translateX(-50%);
}

.trait-dot {
  position: absolute;
  z-index: 3;
  top: 50%;
  width: 28px;
  height: 28px;
  border: 4px solid #fffdf8;
  border-radius: 50%;
  background: var(--trait-color);
  box-shadow: 0 6px 16px rgba(74, 58, 38, 0.24);
}

.trait-bar.is-left-strong .trait-dot {
  left: var(--strong-score);
  transform: translate(-50%, -50%);
}

.trait-bar.is-right-strong .trait-dot {
  left: calc(100% - var(--strong-score));
  transform: translate(-50%, -50%);
}

.trait-labels {
  display: flex;
  justify-content: space-between;
  color: var(--muted);
  font-size: 14px;
  font-weight: 800;
}

.progress-pill {
  flex: 0 0 auto;
  min-width: 76px;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 8px 12px;
  text-align: center;
  color: var(--muted);
  font-weight: 750;
}

.single-question-card {
  display: grid;
  grid-template-rows: 44px auto auto;
  gap: 16px;
  padding: 30px 42px 32px;
  min-height: 320px;
  align-content: start;
}

.question-number {
  display: inline-grid;
  place-items: center;
  width: 58px;
  height: 34px;
  border: 1px solid #cbb99f;
  border-radius: 999px;
  background: #f7efe2;
  color: #5d4c3b;
  font-size: 18px;
  font-weight: 850;
}

.question-text {
  margin: 0;
  min-height: 86px;
  overflow: visible;
  font-size: 23px;
  line-height: 1.45;
  font-weight: 800;
}

.answer-grid {
  display: grid;
  grid-template-columns: auto repeat(7, minmax(34px, 1fr)) auto;
  gap: 12px;
  align-items: center;
  padding: 18px 20px;
  background: #f7f1e8;
  border: 1px solid #e2d5c4;
  border-radius: 16px;
}

.answer-grid::before,
.answer-grid::after {
  font-size: 18px;
  line-height: 1.2;
  font-weight: 800;
  white-space: nowrap;
}

.answer-grid::before {
  content: "そう思う";
  color: #2f8f66;
}

.answer-grid::after {
  content: "そう思わない";
  color: #7c638d;
}

.answer-option {
  display: grid;
  place-items: center;
  width: 100%;
  height: 72px;
  min-width: 0;
  border: 0;
  border-radius: 8px;
  background: transparent;
  padding: 0;
  cursor: pointer;
}

.answer-option.is-selected {
  background: transparent;
  box-shadow: none;
}

.answer-dot {
  display: block;
  width: 52px;
  height: 52px;
  border: 3px solid #9b938a;
  border-radius: 999px;
  background: #fffdf8;
  transition: transform 120ms ease, background 120ms ease, box-shadow 120ms ease;
}

.answer-agree .answer-dot {
  border-color: #2f8f66;
}

.answer-disagree .answer-dot {
  border-color: #7c638d;
}

.answer-neutral .answer-dot {
  width: 38px;
  height: 38px;
  border-color: #98a2b3;
}

.answer-medium .answer-dot {
  width: 58px;
  height: 58px;
}

.answer-large .answer-dot {
  width: 74px;
  height: 74px;
}

.answer-option:hover .answer-dot,
.answer-option.is-selected .answer-dot {
  transform: scale(1.06);
}

.answer-agree.is-selected .answer-dot {
  background: #2f8f66;
  box-shadow: 0 8px 18px rgba(47, 143, 102, 0.22);
}

.answer-disagree.is-selected .answer-dot {
  background: #7c638d;
  box-shadow: 0 8px 18px rgba(124, 99, 141, 0.22);
}

.answer-neutral.is-selected .answer-dot {
  background: #98a2b3;
  box-shadow: 0 8px 18px rgba(102, 112, 133, 0.18);
}

.flow-actions {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 18px 24px 24px;
  border-top: 1px solid var(--line);
  background: #fbf7ef;
}

.flow-actions .ghost-button {
  min-width: 110px;
}

.ghost-button:disabled {
  cursor: not-allowed;
  opacity: 0.45;
}

@media (max-width: 980px) {
  .app-shell {
    width: min(100% - 24px, 920px);
  }
}

@media (max-width: 720px) {
  .app-shell {
    width: min(100% - 18px, 1440px);
    margin: 9px auto;
  }

  .result-panel,
  .question-header,
  .single-question-card {
    padding-left: 14px;
    padding-right: 14px;
  }

  h1 {
    font-size: 30px;
  }

  h2 {
    font-size: 24px;
  }

  .type-summary,
  .single-question-card {
    grid-template-columns: 1fr;
  }

  .trait-row {
    padding: 12px;
  }

  .trait-title {
    display: grid;
    gap: 8px;
  }

  .trait-score {
    width: fit-content;
  }

  .type-illustration {
    min-height: 112px;
  }

  .type-illustration svg {
    width: 132px;
    height: 110px;
  }

  .question-number {
    width: 40px;
    height: 40px;
    font-size: 18px;
  }

  .single-question-card {
    grid-template-rows: 40px auto auto;
    gap: 12px;
    min-height: 0;
    padding-top: 22px;
    padding-bottom: 22px;
  }

  .question-text {
    min-height: 72px;
    font-size: 18px;
    line-height: 1.45;
  }

  .answer-grid {
    grid-template-columns: auto repeat(7, minmax(24px, 1fr)) auto;
    gap: 7px;
  }

  .answer-grid::before,
  .answer-grid::after {
    font-size: 13px;
  }

  .answer-option {
    height: 48px;
  }

  .answer-dot {
    width: 30px;
    height: 30px;
    border-width: 3px;
  }

  .answer-neutral .answer-dot {
    width: 25px;
    height: 25px;
  }

  .answer-medium .answer-dot {
    width: 36px;
    height: 36px;
  }

  .answer-large .answer-dot {
    width: 44px;
    height: 44px;
  }
}

    </style>
  </head>
  <body>
    <main class="app-shell">
      <section class="question-panel" id="questionScreen" aria-labelledby="questions-title">
        <div class="question-header">
          <div>
            <p class="eyebrow">16鑑定</p>
            <h1 id="questions-title">質問</h1>
          </div>
          <div class="progress-pill"><span id="currentNumber">1</span> / 60</div>
        </div>

        <div class="progress-track" aria-hidden="true">
          <div class="progress-fill" id="progressFill"></div>
        </div>

        <article class="single-question-card">
          <div class="question-number" id="questionNumber">1</div>
          <p class="question-text" id="questionText"></p>
          <div class="answer-grid" id="answerGrid"></div>
        </article>

        <div class="flow-actions">
          <button class="ghost-button" id="prevButton" type="button">戻る</button>
          <button class="ghost-button" id="clearButton" type="button">リセット</button>
        </div>
      </section>

      <section class="result-panel is-hidden" id="resultScreen" aria-labelledby="result-title">
        <div class="result-topline">
          <div>
            <p class="eyebrow">鑑定結果</p>
            <h1 id="result-title">性格特性</h1>
          </div>
          <button class="ghost-button" id="restartButton" type="button">もう一度</button>
        </div>

        <div class="type-summary">
          <div class="type-mark" id="typeMark">INFP-T</div>
          <div>
            <div class="type-label">あなたの性格タイプ</div>
            <div class="type-name" id="typeName">INFP-T</div>
            <div class="type-japanese" id="typeJapaneseName">仲介者</div>
            <div class="type-group" id="typeGroup">外交官</div>
            <div class="type-copy" id="typeCopy">内向型（I） / 直感型（N） / 感情型（F） / 探索型（P） / 激動型（T）</div>
          </div>
          <div class="type-illustration" id="typeIllustration" aria-hidden="true"></div>
        </div>

        <p class="type-description" id="typeDescription"></p>

        <div class="result-actions">
          <button class="primary-button" id="showImageButton" type="button">シェア用画像を表示</button>
          <span class="copy-status" id="copyStatus" aria-live="polite"></span>
        </div>

        <div class="share-preview is-hidden" id="sharePreview">
          <p>画像を長押しして保存できます</p>
          <img id="shareImage" alt="鑑定結果のシェア画像">
        </div>

        <div class="trait-list" id="traitList"></div>
      </section>
    </main>

    <script>
const questions = [
  { id: 1, text: "定期的に新しい友人を作っている。", axis: "E/I", target: "E" },
  { id: 2, text: "単純明快なアイデアよりも、複雑で斬新なアイデアのほうがワクワクする。", axis: "N/S", target: "N" },
  { id: 3, text: "事実に基づいた議論よりも、感情的に響くものに説得力を感じる。", axis: "T/F", target: "F" },
  { id: 4, text: "自分の生活と仕事の空間は、清潔で整理整頓されている。", axis: "J/P", target: "J" },
  { id: 5, text: "大きなプレッシャーがあっても通常、冷静でいられる。", axis: "A/T", target: "A" },
  { id: 6, text: "人脈を広げたり、見知らぬ人に自分を売り込んだりするのは、とても大変だと感じる。", axis: "E/I", target: "I" },
  { id: 7, text: "仕事に優先順位をつけ、効率的に計画を立て、期限よりかなり前に完了させることが多い。", axis: "J/P", target: "J" },
  { id: 8, text: "数字やデータより、人々の物語や感情のほうがあなたに力強く響く。", axis: "T/F", target: "F" },
  { id: 9, text: "予定表やリストなどの整理・管理ツールを使うのが好き。", axis: "J/P", target: "J" },
  { id: 10, text: "些細なことでも間違えると、自分の能力と知識全般を疑ってしまう。", axis: "A/T", target: "T-Id" },
  { id: 11, text: "事前のアレンジなしに、自分が興味のある人のところに行って話しかけるのは簡単。", axis: "E/I", target: "E" },
  { id: 12, text: "クリエイティブな作品のさまざまな解釈についての議論には、興味がない。", axis: "N/S", target: "S" },
  { id: 13, text: "行動方針を決めるとき、あなたは他の人の感情より事実を大切にします。", axis: "T/F", target: "T" },
  { id: 14, text: "何も計画を立てずに一日を過ごすことがよくある。", axis: "J/P", target: "P" },
  { id: 15, text: "会う人に好印象を残すかどうかは、ほとんど気にしない。", axis: "T/F", target: "T" },
  { id: 16, text: "チームで何かをするのが好き。", axis: "E/I", target: "E" },
  { id: 17, text: "未経験の新しいアプローチを試すのは楽しいと感じる。", axis: "N/S", target: "N" },
  { id: 18, text: "完全に正直であることよりも、思いやりを持つことを優先する。", axis: "T/F", target: "F" },
  { id: 19, text: "新しい経験や知識を積極的に追求する。", axis: "N/S", target: "N" },
  { id: 20, text: "物事が悪い方向に向かうのではないかと心配しがち。", axis: "A/T", target: "T-Id" },
  { id: 21, text: "グループで行う趣味やアクティビティより、一人で行うもののほうが楽しい。", axis: "E/I", target: "I" },
  { id: 22, text: "仕事として架空の物語を書いている自分は想像できない。", axis: "N/S", target: "S" },
  { id: 23, text: "感情的な面を多少無視してでも、効率的な決断を好む。", axis: "T/F", target: "T" },
  { id: 24, text: "やらなければいけないことをしてからリラックスするのが好き。", axis: "J/P", target: "J" },
  { id: 25, text: "意見の相違がある場合、他人の感情をいたわるよりも自分の主張を証明することを優先する。", axis: "T/F", target: "T" },
  { id: 26, text: "社交の場では大抵、最初に他の人が自己紹介するのを待つ。", axis: "E/I", target: "I" },
  { id: 27, text: "とても急に機嫌が変わることがある。", axis: "A/T", target: "T-Id" },
  { id: 28, text: "感情的な議論には簡単に動かされない。", axis: "T/F", target: "T" },
  { id: 29, text: "ギリギリのタイミングで最後にやっと何かを行うことが多い。", axis: "J/P", target: "P" },
  { id: 30, text: "倫理的なジレンマについて議論するのが好き。", axis: "N/S", target: "N" },
  { id: 31, text: "一人でいるより、人と一緒にいる方が好き。", axis: "E/I", target: "E" },
  { id: 32, text: "議論がとても理論的になると、退屈に感じたり興味を失ったりする。", axis: "N/S", target: "S" },
  { id: 33, text: "事実と感情が相反する場合、たいていは自分の心に従う。", axis: "T/F", target: "F" },
  { id: 34, text: "仕事や勉強のために一定のスケジュールを維持するのは難しいと感じる。", axis: "J/P", target: "P" },
  { id: 35, text: "一度決めたら、その決断を疑うことはほとんどない。", axis: "A/T", target: "A" },
  { id: 36, text: "友達は、自分を活発で社交的な人間だというだろう。", axis: "E/I", target: "E" },
  { id: 37, text: "文章を書くなど、さまざまな創造的表現に惹かれる。", axis: "N/S", target: "N" },
  { id: 38, text: "通常、感情的な印象よりも客観的な事実に基づいて物事を決める。", axis: "T/F", target: "T" },
  { id: 39, text: "1日ごとの「やることリスト」を作るのが好き。", axis: "J/P", target: "J" },
  { id: 40, text: "不安はほとんど感じない。", axis: "A/T", target: "A" },
  { id: 41, text: "電話はかけないようにしている。", axis: "E/I", target: "I" },
  { id: 42, text: "馴染みのないアイデアや視点の探求は楽しい。", axis: "N/S", target: "N" },

function interpolateScore(value, scores) {
  if (value <= -3) return scores[0];
  if (value >= 3) return scores[6];

  const low = Math.floor(value);
  const high = Math.ceil(value);
  const lowIndex = low + 3;
  const highIndex = high + 3;
  if (low === high) return scores[lowIndex];

  const ratio = value - low;
  return Math.round(scores[lowIndex] + (scores[highIndex] - scores[lowIndex]) * ratio);
}

function averageForAxis(axis) {
  const axisQuestions = questions.filter((question) => question.axis === axis);
  const total = axisQuestions.reduce((sum, question) => sum + (answers.get(question.id) ?? 0), 0);
  return total / axisQuestions.length;
}

function calculateResults() {
  return axisConfigs.map((config) => {
    const average = averageForAxis(config.axis);
    const leftScore = interpolateScore(average, config.scores);
    const rightScore = 100 - leftScore;
    const isLeft = leftScore >= 50;
    const trait = isLeft ? config.left : config.right;
    const label = isLeft ? config.leftLabel : config.rightLabel;
    const percent = isLeft ? leftScore : rightScore;

    return { ...config, average, leftScore, rightScore, trait, label, percent };
  });
}

function wrapCanvasText(ctx, text, x, y, maxWidth, lineHeight, maxLines = Infinity) {
  const words = Array.from(text);
  const lines = [];
  let line = "";

  words.forEach((char) => {
    const testLine = line + char;
    if (ctx.measureText(testLine).width > maxWidth && line) {
      lines.push(line);
      line = char;
    } else {
      line = testLine;
    }
  });
  if (line) lines.push(line);

  lines.slice(0, maxLines).forEach((item, index) => {
    ctx.fillText(item, x, y + index * lineHeight);
  });

  return y + Math.min(lines.length, maxLines) * lineHeight;
}

function roundRectPath(ctx, x, y, width, height, radius) {
  const r = Math.min(radius, width / 2, height / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + width, y, x + width, y + height, r);
  ctx.arcTo(x + width, y + height, x, y + height, r);
  ctx.arcTo(x, y + height, x, y, r);
  ctx.arcTo(x, y, x + width, y, r);
  ctx.closePath();
}

function drawStar(ctx, cx, cy, outerRadius, innerRadius) {
  ctx.beginPath();
  for (let i = 0; i < 10; i += 1) {
    const angle = -Math.PI / 2 + (i * Math.PI) / 5;
    const radius = i % 2 === 0 ? outerRadius : innerRadius;
    const x = cx + Math.cos(angle) * radius;
    const y = cy + Math.sin(angle) * radius;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.closePath();
}

  ctx.fillStyle = "#292521";

  drawShareIllustration(ctx, data.profile.group, 1010, 135, 1.2);

  ctx.font = "850 46px -apple-system, BlinkMacSystemFont, sans-serif";
  ctx.fillText(data.profile.name, 130, 325);

  ctx.fillStyle = "#fffdf8";
  roundRectPath(ctx, 130, 354, 220, 52, 26);
  ctx.fill();
  ctx.strokeStyle = "#ded4c5";
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = "#74695d";
  ctx.font = "800 24px -apple-system, BlinkMacSystemFont, sans-serif";
  ctx.fillText(data.profile.group, 165, 389);

  ctx.fillStyle = "#74695d";
  ctx.font = "700 27px -apple-system, BlinkMacSystemFont, sans-serif";
  wrapCanvasText(ctx, data.profile.description, 130, 465, 1140, 42, 4);

  let y = 650;
  data.results.forEach((result) => {
    ctx.fillStyle = "#292521";
    ctx.font = "850 26px -apple-system, BlinkMacSystemFont, sans-serif";
    ctx.fillText(result.name, 130, y);

    ctx.fillStyle = result.color;
    ctx.font = "900 31px -apple-system, BlinkMacSystemFont, sans-serif";
    const scoreText = `${result.percent}% ${result.label}`;
    const scoreWidth = ctx.measureText(scoreText).width;
    ctx.fillText(scoreText, 1270 - scoreWidth, y);

    const barX = 130;
    const barY = y + 28;
    const barW = 1140;
    const barH = 24;
    const fillW = (barW * result.percent) / 100;
    const fillX = result.trait === result.left ? barX : barX + barW - fillW;
    ctx.fillStyle = result.softColor;
    roundRectPath(ctx, barX, barY, barW, barH, 12);
    ctx.fill();
    ctx.fillStyle = result.color;
    roundRectPath(ctx, fillX, barY, fillW, barH, 12);
    ctx.fill();
    ctx.fillStyle = "rgba(41, 37, 33, 0.34)";
    roundRectPath(ctx, barX + barW / 2 - 2, barY - 5, 4, barH + 10, 2);
    ctx.fill();
    ctx.fillStyle = "#292521";
    ctx.font = "700 19px -apple-system, BlinkMacSystemFont, sans-serif";
    ctx.fillText(result.leftLabel, barX, barY + 50);
    const rightWidth = ctx.measureText(result.rightLabel).width;
    ctx.fillText(result.rightLabel, barX + barW - rightWidth, barY + 50);
    y += 132;
  });
  return canvas;
}

async function showResultImage() {
  copyStatus.textContent = "画像を作成中...";
  const canvas = makeShareCanvas();
  const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/png"));
  if (!blob) {
    copyStatus.textContent = "画像作成に失敗しました";
    return;
  }

  if (latestShareUrl) URL.revokeObjectURL(latestShareUrl);
  latestShareUrl = URL.createObjectURL(blob);
  shareImage.src = latestShareUrl;
  sharePreview.classList.remove("is-hidden");
  copyStatus.textContent = "画像を表示しました";
  sharePreview.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

  currentIndex += 1;
  renderQuestion();
}

function resetFlow() {
  answers.clear();
  currentIndex = 0;
  sharePreview.classList.add("is-hidden");
  shareImage.removeAttribute("src");
  copyStatus.textContent = "";
  if (latestShareUrl) {
    URL.revokeObjectURL(latestShareUrl);
    latestShareUrl = null;
  }
  showQuestionScreen();
}

answerGrid.addEventListener("click", (event) => {
  const button = event.target.closest("[data-value]");
  if (!button) return;
  setAnswer(Number(button.dataset.value));
});

prevButton.addEventListener("click", () => {
  if (currentIndex === 0) return;
  currentIndex -= 1;
  renderQuestion();
});

clearButton.addEventListener("click", resetFlow);
restartButton.addEventListener("click", resetFlow);
showImageButton.addEventListener("click", showResultImage);

renderQuestion();

    </script>
  </body>
</html>
