<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>あなたの正体を知る</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap');

*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:#FAFAF7;
  color:#1A1A1A;
  font-family:'Noto Sans JP',sans-serif;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:48px 0;
}
.wrap{
  width:100%;
  max-width:480px;
  padding:0 28px;
}

/* ── ボタン ── */
.btn-primary{
  width:100%;padding:18px;
  background:#1A1A1A;border:none;
  color:#FFF;
  font-family:'Shippori Mincho',serif;
  font-size:16px;font-weight:700;letter-spacing:4px;
  cursor:pointer;border-radius:4px;
  transition:background .2s;
  text-decoration:none;display:block;text-align:center;
}
.btn-primary:hover{background:#333;}
.btn-ghost{
  background:none;border:none;color:#AAA;font-size:14px;
  cursor:pointer;letter-spacing:1px;
  font-family:'Noto Sans JP',sans-serif;
  text-decoration:underline;display:block;
  margin:16px auto 0;text-align:center;
}

/* ── TOP ── */
#sTop{text-align:center;}
.badge{
  display:inline-block;
  font-size:13px;letter-spacing:4px;color:#B8860B;
  border:1px solid #B8860B;
  padding:6px 20px;border-radius:2px;margin-bottom:24px;
}
/* 黄金の羅針盤：大きく */
.brand-title{
  font-family:'Shippori Mincho',serif;
  font-size:clamp(36px,9vw,56px);
  font-weight:800;
  color:#B8860B;
  line-height:1.3;
  margin-bottom:20px;
  text-shadow: 0 2px 12px rgba(184,134,11,0.15);
}
/* 今、辛いと自分を知らないは元のサイズ */
.catch-main{
  font-family:'Shippori Mincho',serif;
  font-size:clamp(18px,4.5vw,22px);
  font-weight:700;line-height:1.8;
  color:#1A1A1A;margin-bottom:6px;
}
.hl{
  color:#B8860B;
  display:block;
  font-size:clamp(18px,4.5vw,22px);
}
/* 生年月日だけで：大きく */
.catch-sub{
  font-size:clamp(16px,4vw,20px);
  color:#555;
  margin-bottom:44px;
  line-height:1.8;
  font-weight:700;
  font-family:'Shippori Mincho',serif;
}

/* ── INPUT ── */
#sInput{display:none;}
.q-label{font-size:13px;letter-spacing:2px;color:#B8860B;margin-bottom:14px;font-weight:700;}
.date-row{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;margin-bottom:24px;max-width:480px;}
.df{display:flex;flex-direction:column;gap:6px;}
.df span{font-size:13px;color:#999;letter-spacing:1px;}
.df input{
  width:100%;
  background:#F5F5F0;border:1px solid #DDD;
  border-radius:4px;padding:14px 10px;
  color:#1A1A1A;font-size:22px;
  font-family:'Shippori Mincho',serif;
  text-align:center;outline:none;
  -moz-appearance:textfield;transition:border-color .2s;
}
.df input::-webkit-outer-spin-button,
.df input::-webkit-inner-spin-button{-webkit-appearance:none;}
.df input:focus{border-color:#B8860B;}
.df input::placeholder{color:#CCC;font-size:14px;}
.err{font-size:14px;color:#C0392B;margin-bottom:14px;display:none;}

/* ── RESULT 共通 ── */
#sResultA,#sResultB{display:none;text-align:center;}
.r-icon{font-size:72px;line-height:1;margin-bottom:12px;animation:pop .4s ease;}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.r-animal-name{
  font-family:'Shippori Mincho',serif;
  font-size:26px;font-weight:800;color:#1A1A1A;margin-bottom:24px;
}
.r-box{
  background:#F5F5F0;border-radius:8px;
  padding:24px 20px;margin-bottom:22px;text-align:left;
}
.r-box-label{
  font-size:13px;letter-spacing:2px;color:#B8860B;
  font-weight:700;margin-bottom:12px;
}
.r-line{
  font-family:'Shippori Mincho',serif;
  font-size:clamp(17px,4.5vw,21px);
  font-weight:700;line-height:1.7;color:#1A1A1A;
}
.r-bridge{font-size:16px;color:#555;line-height:2;margin-bottom:24px;}
.r-bridge strong{color:#1A1A1A;font-weight:700;}

/* ── 十干専用 ── */
.kan-attr-badge{
  display:inline-block;
  font-size:13px;letter-spacing:2px;
  color:#FFF;background:#B8860B;
  padding:6px 20px;border-radius:20px;
  margin-bottom:20px;font-weight:700;
}
.kan-title-main{
  font-family:'Shippori Mincho',serif;
  font-size:clamp(28px,7vw,38px);
  font-weight:800;color:#1A1A1A;
  line-height:1.4;margin-bottom:6px;
}
.kan-title-sub{
  font-size:16px;color:#666;
  margin-bottom:24px;line-height:1.8;
}

/* ── PC対応 ── */
@media(min-width:768px){
  .brand-title{ font-size: clamp(48px,6vw,64px); }
}
</style>
</head>
<body>
<div class="wrap">

<!-- TOP -->
<div id="sTop">
  <div class="brand-title">黄金の羅針盤</div>
  <div class="catch-main">
    あなたが今、辛いのは
    <span class="hl">自分を知らないから</span>
  </div>
  <div class="catch-sub">生年月日だけで、あなたの正体がわかる。</div>
  <button class="btn-primary" onclick="go('sInput')">無料で診断する</button>
</div>

<!-- INPUT -->
<div id="sInput" style="max-width:480px;margin:0 auto;">
  <div class="q-label">生年月日を入力</div>
  <div class="date-row">
    <div class="df">
      <span>年（西暦）</span>
      <input type="text" inputmode="numeric" id="iy" placeholder="1985">
    </div>
    <div class="df">
      <span>月</span>
      <input type="text" inputmode="numeric" id="im" placeholder="5">
    </div>
    <div class="df">
      <span>日</span>
      <input type="text" inputmode="numeric" id="id" placeholder="15">
    </div>
  </div>
  <div class="err" id="err">生年月日を正しく入力してください</div>
  <button class="btn-primary" onclick="diagnose()">診断する</button>
</div>

<!-- RESULT A: 動物 -->
<div id="sResultA">
  <div class="r-icon" id="aIcon"></div>
  <div class="r-animal-name" id="aName"></div>
  <div class="r-box">
    <div class="r-box-label">あなたのハードモード</div>
    <div class="r-line" id="aHm"></div>
  </div>
  <div class="r-bridge">
    でも、それだけじゃない。<br>
    あなたには<strong>もう一つの正体</strong>がある。
  </div>
  <button class="btn-primary" onclick="go('sResultB')">本質を見る</button>
  <button class="btn-ghost" onclick="go('sTop')">← 最初から</button>
</div>

<!-- RESULT B: 十干（二つ名メイン） -->
<div id="sResultB">
  <div class="kan-attr-badge" id="bAttrBadge"></div>
  <div class="r-icon" id="bIcon"></div>
  <div class="kan-title-main" id="bTitleMain"></div>
  <div class="kan-title-sub" id="bTitleSub"></div>
  <div class="copy-box">
    <div class="copy-text" id="bCopyText"></div>
    <button class="btn-copy" id="copyBtn" onclick="copyResult()">コピー</button>
  </div>
  <div class="r-box">
    <div class="r-box-label">あなたが辛かった理由</div>
    <div class="r-line" id="bShadow"></div>
  </div>
  <div class="r-bridge">
    この力の<strong>使い方</strong>が、<br>
    黄金の羅針盤にある。
  </div>
  <a class="btn-primary" href="https://note.com/nicekai/n/n265857ef361e" target="_blank">羅針盤を受け取る</a>
  <button class="btn-ghost" onclick="go('sTop')">← 最初から</button>
</div>

</div>
<script>
const CHAR_TO_ANIMAL={1:0,7:0,42:0,48:0,2:1,8:1,41:1,47:1,3:2,9:2,15:2,33:2,34:2,40:2,46:2,4:3,10:3,16:3,39:3,45:3,60:3,5:4,44:4,50:4,53:4,56:4,59:4,6:5,43:5,49:5,54:5,55:5,11:6,17:6,32:6,38:6,12:7,18:7,31:7,37:7,13:8,19:8,24:8,25:8,30:8,36:8,14:9,20:9,23:9,26:9,29:9,35:9,21:10,22:10,27:10,28:10,51:11,52:11,57:11,58:11};
const ANIMALS=[
  {icon:'🐆',name:'チーター',   hm:'速すぎて、誰もついてこれない'},
  {icon:'🦝',name:'たぬき',     hm:'空気を読みすぎて、自分を見失う'},
  {icon:'🐒',name:'猿',         hm:'考えすぎて、動けなくなる'},
  {icon:'🐨',name:'コアラ',     hm:'癒しすぎて、なめられる'},
  {icon:'🐾',name:'黒ひょう',   hm:'実力があるのに、表に出てこない'},
  {icon:'🐯',name:'虎',         hm:'全力すぎて、燃え尽きる'},
  {icon:'🦌',name:'こじか',     hm:'優しすぎて、自分が後回しになる'},
  {icon:'🐘',name:'ゾウ',       hm:'動き出すまでに、時間がかかりすぎる'},
  {icon:'🐺',name:'狼',         hm:'群れを作れるのに、いつも孤独になる'},
  {icon:'🐑',name:'ひつじ',     hm:'穏やかすぎて、存在を忘れられる'},
  {icon:'🦄',name:'ペガサス',   hm:'夢ばかり大きく、地に足がつかない'},
  {icon:'🦁',name:'ライオン',   hm:'強すぎて、人が近づけない'},
];
const JIKKAN=[
  {icon:'🌳',attrBadge:'L-BUILD ／ 木',titleMain:'理想型リーダー',titleSub:'誰も見たことない道を、ひとりで切り拓く人',shadow:'あなたが孤独なのは、先を行きすぎているから'},
  {icon:'🌿',attrBadge:'P-BUILD ／ 木',titleMain:'共感型プロデューサー',titleSub:'しなやかに曲がりながら、絶対に折れない人',shadow:'あなたが疲れるのは、誰かのために使いすぎているから'},
  {icon:'☀️',attrBadge:'I-EMO ／ 火',titleMain:'表現型インフルエンサー',titleSub:'全方位に光を放ち、大衆を動かす人',shadow:'あなたが空回りするのは、伝える場所が違うから'},
  {icon:'🕯️',attrBadge:'C-EMO ／ 火',titleMain:'職人型クリエイター',titleSub:'暗闇の一点を鋭く照らす、唯一無二の人',shadow:'あなたが認められないのは、まだ世界があなたを知らないから'},
  {icon:'⛰️',attrBadge:'M-CORE ／ 土',titleMain:'統括型マネージャー',titleSub:'圧倒的な器で、人と現場を動かす人',shadow:'あなたが重いのは、背負いすぎているから'},
  {icon:'🌾',attrBadge:'D-CORE ／ 土',titleMain:'調和型ディレクター',titleSub:'万物を平等に育てる、大地のような人',shadow:'あなたが報われないのは、見えないところで与えすぎているから'},
  {icon:'⚔️',attrBadge:'V-ACT ／ 金',titleMain:'突破型ヴァンガード',titleSub:'最前線でリスクを取り、現状を突破する人',shadow:'あなたが空回りするのは、動く方向が定まっていないから'},
  {icon:'💎',attrBadge:'S-ACT ／ 金',titleMain:'専門型スペシャリスト',titleSub:'細部を磨き上げ、プレミアムなポジションを確立する人',shadow:'あなたが埋もれるのは、磨く場所をまだ見つけていないから'},
  {icon:'🌊',attrBadge:'E-DESIGN ／ 水',titleMain:'開拓型パイオニア',titleSub:'時代の先を読み、誰も見ぬ地平を拓く人',shadow:'あなたが孤立するのは、見えているものが周りと違うから'},
  {icon:'🌧️',attrBadge:'N-DESIGN ／ 水',titleMain:'循環型ナビゲーター',titleSub:'膨大な知を美しく循環させ、人を導く人',shadow:'あなたが迷うのは、自分が地図を持っていることに気づいていないから'},
];

// 全角数字→半角変換
function toHankaku(str) {
  return str.replace(/[０-９]/g, function(s) {
    return String.fromCharCode(s.charCodeAt(0) - 0xFEE0);
  }).replace(/[^0-9]/g, '');
}

function getAnimalChar(y,m,d){
  const base=new Date(1985,0,1);
  const t=new Date(y,m-1,d);
  const diff=Math.floor((t-base)/86400000);
  return ((diff+36)%60+60)%60+1;
}
function getJikkanIdx(y,m,d){
  const base=new Date(1900,0,1);
  const target=new Date(y,m-1,d);
  const diff=Math.round((target-base)/86400000);
  return ((diff%10)+10)%10;
}
function copyResult(){
  const text = document.getElementById('bCopyText').textContent + '\n#黄金の羅針盤';
  navigator.clipboard.writeText(text).then(function(){
    var btn = document.getElementById('copyBtn');
    btn.textContent = 'コピー済み';
    btn.classList.add('copied');
    setTimeout(function(){
      btn.textContent = 'コピー';
      btn.classList.remove('copied');
    }, 2000);
  });
}

function go(id){
  ['sTop','sInput','sResultA','sResultB'].forEach(s=>{
    document.getElementById(s).style.display=s===id?'block':'none';
  });
  window.scrollTo(0,0);
}
function diagnose(){
  const y=parseInt(toHankaku(document.getElementById('iy').value));
  const m=parseInt(toHankaku(document.getElementById('im').value));
  const d=parseInt(toHankaku(document.getElementById('id').value));
  const err=document.getElementById('err');
  if(!y||!m||!d||y<1900||y>2100||m<1||m>12||d<1||d>31){err.style.display='block';return;}
  err.style.display='none';
  const charNo=getAnimalChar(y,m,d);
  const ai=CHAR_TO_ANIMAL[charNo]??(charNo%12);
  const a=ANIMALS[ai];
  document.getElementById('aIcon').textContent=a.icon;
  document.getElementById('aName').textContent=a.name;
  document.getElementById('aHm').textContent=a.hm;
  const ki=getJikkanIdx(y,m,d);
  const k=JIKKAN[ki];
  document.getElementById('bAttrBadge').textContent=k.attrBadge;
  document.getElementById('bIcon').textContent=k.icon;
  document.getElementById('bTitleMain').textContent=k.titleMain;
  document.getElementById('bTitleSub').textContent=k.titleSub;
  document.getElementById('bShadow').textContent=k.shadow;
  document.getElementById('bCopyText').textContent=k.titleMain+' | '+k.attrBadge.split(' ')[0];
  go('sResultA');
}
go('sTop');
</script>
</body>
</html>
